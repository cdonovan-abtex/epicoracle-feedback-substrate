# Reproducible CI for the substrate itself on every PR.

name: PR CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Required PR Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.13

      - name: Verify lockfile and install dependencies
        run: |
          uv lock --check
          uv sync --python 3.12.13 --locked --extra dev

      - name: Lint (ruff)
        run: uv run --offline ruff check .

      - name: Type check (mypy strict)
        run: uv run --offline mypy src

      - name: Test offline (pytest)
        run: uv run --offline pytest --disable-socket --allow-unix-socket -v

      - name: Build package
        run: uv build --offline --no-build-isolation
