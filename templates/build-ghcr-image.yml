# GHCR publisher template — intentionally disabled while migration is deferred.
#
# A repository copied from this template must not claim image publishing is
# active until Captain separately authorizes GHCR activation. When that day
# comes, the exact package identity is the repository basename by default, or
# an explicit package name for a deliberate mismatch. Private pulls require
# ``packages: read``, exact repository/package access, and an explicit source
# label on the published image.
#
# This template is a disabled artifact by default: it shows the future seam
# but does not publish on push and does not become active unless a repo owner
# explicitly opts in.

name: Build & Publish Image (disabled)

on:
  workflow_dispatch:

jobs:
  disabled-note:
    if: ${{ vars.GHCR_PUBLISHING_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why publishing is disabled
        run: |
          cat <<'EOF'
          GHCR publishing is disabled while migration is deferred.
          Future activation requires Captain approval, private package access,
          packages: read, exact repository/package access, and source labeling.
          EOF

  publish:
    if: ${{ vars.GHCR_PUBLISHING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/abtex/${{ github.event.repository.name }}
          tags: |
            ghcr.io/abtex/${{ github.event.repository.name }}:main-latest
            ghcr.io/abtex/${{ github.event.repository.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
